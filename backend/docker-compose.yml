services:
  postgres:
    image: postgres:16
    container_name: neuroguard-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-neuroguard}
      POSTGRES_USER: ${DB_USERNAME:-neuroguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-neuroguard}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - neuroguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  neuroguard-pgdata:
