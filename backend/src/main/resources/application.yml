spring:
  application:
    name: neuroguard-backend
  profiles:
    default: dev
  config:
    # Optional backend/.env (git-ignored) supplies DB_URL, DB_USERNAME, DB_PASSWORD, ...
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/neuroguard}
    username: ${DB_USERNAME:neuroguard}
    password: ${DB_PASSWORD:neuroguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Min 32 bytes. Required outside the "dev" profile; in dev a random per-run secret is used if unset.
    secret: ${JWT_SECRET:}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
    issuer: neuroguard
  scanner:
    qa:
      # A scanner whose QA is due within this many days shows as DUE_SOON.
      due-soon-days: ${SCANNER_QA_DUE_SOON_DAYS:30}
  bootstrap-admin:
    # If no ADMIN exists at startup, one is created from these. Skipped (with a warning) when unset.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
